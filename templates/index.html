<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe - VS AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .status {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255,255,255,0.9);
        }
        .status.game-over {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        .status.x-wins {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
        }
        .status.draw {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-bottom: 20px;
            background: #fff;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .cell {
            aspect-ratio: 1;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            border-radius: 8px;
        }
        .cell:hover {
            background: #f0f0f0;
            transform: scale(1.03);
            border-color: #667eea;
        }
        .cell.x {
            color: #ff416c;
        }
        .cell.o {
            color: #11998e;
        }
        .cell:empty::before {
            content: '';
            color: #ddd;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-new-game {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .btn-new-game:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(255,255,255,0.8);
            border-radius: 8px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-x::before {
            content: 'X';
            color: #ff416c;
            font-size: 24px;
            font-weight: bold;
        }
        .legend-o::before {
            content: 'O';
            color: #11998e;
            font-size: 24px;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
    </style>
</head>
<body>
    <h1>Tic-Tac-Toe</h1>
    <p class="subtitle">Play against the Minimax AI</p>

    <div class="legend">
        <span class="legend-x">You are X (First player)</span>
        <span class="legend-o">AI is O (Perfect play)</span>
    </div>

    <div class="status" id="status">Loading...</div>

    <div class="board" id="board">
        <!-- Cells will be created by JavaScript -->
    </div>

    <div class="controls">
        <button class="btn-new-game" id="newGameBtn">New Game</button>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');
        const newGameBtn = document.getElementById('newGameBtn');

        let currentPlayer = 'X';
        let gameOver = false;

        function createBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.addEventListener('click', handleClick);
                    boardEl.appendChild(cell);
                }
            }
        }

        async function loadBoard() {
            try {
                const response = await fetch('/api/board');
                const data = await response.json();
                updateBoard(data);
            } catch (e) {
                statusEl.textContent = 'Error loading board';
            }
        }

        function updateBoard(data) {
            currentPlayer = data.current_player;
            gameOver = data.game_over;
            statusEl.textContent = data.status;

            statusEl.className = 'status';
            if (data.game_over) {
                if (data.winner) {
                    if (data.winner === 'X') {
                        statusEl.classList.add('x-wins');
                    } else {
                        statusEl.classList.add('game-over');
                    }
                } else {
                    statusEl.classList.add('draw');
                }
            }

            const cells = document.querySelectorAll('.cell');
            data.board.forEach((row, r) => {
                row.forEach((cell, c) => {
                    const el = cells[r * 3 + c];
                    el.textContent = cell === ' ' ? '' : cell;
                    el.className = 'cell' + (cell === 'X' ? ' x' : (cell === 'O' ? ' o' : ''));
                    el.style.pointerEvents = 'auto';
                });
            });
        }

        async function handleClick(e) {
            if (gameOver) return;

            const cell = e.target;
            if (cell.textContent !== '') return;

            const row = parseInt(cell.dataset.row);
            const col = parseInt(cell.dataset.col);

            showLoading();
            await makeMove(row, col);
        }

        function showLoading() {
            statusEl.innerHTML = '<div class="spinner"></div>Computer is thinking...';
        }

        async function makeMove(row, col) {
            try {
                const response = await fetch('/api/move', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ row, col })
                });
                const data = await response.json();
                updateBoard(data);
            } catch (e) {
                statusEl.textContent = 'Error making move';
            }
        }

        async function newGame() {
            try {
                const response = await fetch('/api/reset', { method: 'POST' });
                await loadBoard();
            } catch (e) {
                statusEl.textContent = 'Error resetting game';
            }
        }

        newGameBtn.addEventListener('click', newGame);

        // Initialize
        createBoard();
        loadBoard();
    </script>
</body>
</html>
